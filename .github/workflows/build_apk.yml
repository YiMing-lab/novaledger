name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'novaledger_mobile/**'
      - '.github/workflows/build_apk.yml'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: false

      - name: Scaffold Official Android Platform Files
        working-directory: novaledger_mobile
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.novaledger --project-name=novaledger_mobile

      - name: Configure Android Permissions & App Settings
        working-directory: novaledger_mobile
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />
          '''
          content = content.replace('<application', perms + '    <application')
          content = content.replace('android:label=\"novaledger_mobile\"', 'android:label=\"星芒账本\"')
          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('Successfully configured AndroidManifest.xml')

          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, 'r', encoding='utf-8') as f:
              gc = f.read()
          gc = gc.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
          gc = gc.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
          with open(gradle_path, 'w', encoding='utf-8') as f:
              f.write(gc)
          print('Successfully patched android/app/build.gradle')
          "

      - name: Install Dependencies
        working-directory: novaledger_mobile
        run: |
          flutter pub get

      - name: Verify Dart Code
        working-directory: novaledger_mobile
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Android APK
        working-directory: novaledger_mobile
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaLedger-v2.0.1-Android-Release-APK
          path: novaledger_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
