[package]
name = "novaledger_desktop"
version = "2.0.0"
description = "NovaLedger v2.0 - Local-First Double-Entry Accounting Desktop App (React + TypeScript + shadcn/ui + Tauri 2 + Beancount)"
authors = ["NovaLedger Team"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
